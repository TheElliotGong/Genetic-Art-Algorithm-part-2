name: tests

# Runs on every push and pull request, plus a nightly build so that a break
# caused by a new dependency release is caught even when nobody pushed.
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The oldest version the pinned dependencies support, and the version
        # the project is developed on.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # opencv-python links against libGL and glib, which the GitHub Linux
      # images do not ship with.
      - name: Install OpenCV system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        run: pytest -v --cov --cov-report=xml --cov-report=term-missing --junitxml=junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: warn

  # A single required check that stays green only when the whole matrix does.
  all-tests-passed:
    name: all tests passed
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Fail if any matrix job failed
        if: needs.test.result != 'success'
        run: |
          echo "Matrix result: ${{ needs.test.result }}"
          exit 1
      - run: echo "All matrix jobs passed."
